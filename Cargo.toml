[package]
name = "nagito"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["persistence"] }
nokhwa = { version = "0.10.11", features = ["input-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }

[profile.dev.package."*"]
opt-level = 3

